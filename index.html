<style>
/* Layout: Kopfzeile mit Sieger/Status, Panel "Jetzt dran", Tabs; Baum als horizontal scrollbare Spalten je Runde */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#141A22; --mute:#5A6674; --line:#D3D9E1;
  --accent:#9A5200; --accent-fill:#F5A81A; --accent-ink:#1B1200; --win:#FFF0CC; --ready:#1D6FD1; --off:#8A95A3;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1319; --panel:#18202A; --ink:#E9EDF2; --mute:#94A1B1; --line:#2A3441;
  --accent:#F5A81A; --accent-fill:#F5A81A; --accent-ink:#1B1200; --win:#33280D; --ready:#5AA2FF; --off:#6F7B8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1319; --panel:#18202A; --ink:#E9EDF2; --mute:#94A1B1; --line:#2A3441;
  --accent:#F5A81A; --accent-fill:#F5A81A; --accent-ink:#1B1200; --win:#33280D; --ready:#5AA2FF; --off:#6F7B8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:64px;height:auto;border-radius:8px;display:block}
h1{font:700 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--panel)}
.chip.warn{color:var(--accent);border-color:var(--accent)}
.champ{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;background:var(--accent-fill);color:var(--accent-ink);padding:14px 18px;border-radius:6px}
.champ b.s{font-size:26px}
.champ .t{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.champ b{font:700 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.champ span{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em}
.now{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.now h2,.sec h2{font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--mute);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.now h2 em{font-style:normal;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{touch-action:manipulation;font:600 15px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border:0;background:none;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fill)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ready);outline-offset:1px}
.sec{display:flex;flex-direction:column;gap:10px}
.scroller{overflow-x:auto;padding-bottom:10px}
.tree{display:flex;gap:26px;align-items:stretch;min-width:min-content}
.col{display:flex;flex-direction:column;gap:10px;width:235px;flex:none}
.ct{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:4px}
.cb{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
/* Spielkarte */
.m{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.m.ready{border-color:var(--ready);box-shadow:0 0 0 1px var(--ready)}
.m.wait{opacity:.82}
.m.auto{opacity:.6}
.mh{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;font-size:11px;color:var(--mute);background:color-mix(in srgb,var(--line) 35%,transparent);letter-spacing:.02em}
.mh b{font:700 13px var(--display);color:var(--ink);letter-spacing:.06em}
.mh .rd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:6px;padding:5px 8px;min-height:34px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.w{background:var(--win)}
.row.w .nm{font-weight:600}
.row.l .nm{color:var(--off);text-decoration:line-through;text-decoration-thickness:1px}
.pick{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--off);background:none;color:transparent;cursor:pointer;font-size:12px;line-height:1;padding:0}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.pick:disabled{opacity:.35;cursor:default}
.row.pk{cursor:pointer;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.row.pk:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.row.pk.w:hover{background:var(--win)}
.sc{touch-action:manipulation}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.ph{color:var(--mute);font-style:italic}
.sc{flex:none;width:52px;min-height:32px;font-size:16px !important;text-align:center;font:600 14px var(--body);padding:3px 2px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.bye{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
/* Spielplan / Teams */
.block{display:flex;flex-direction:column;gap:8px}
.block h3{font:600 17px var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:baseline}
.block h3 small{font:500 13px var(--body);color:var(--mute);text-transform:none;letter-spacing:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.tm{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.tm .n{font:700 16px var(--display);color:var(--mute);width:26px;flex:none}
.tm input[type=text]{flex:1;min-width:0;font:14px var(--body);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.tm label{font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center;white-space:nowrap}
.set{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.set input{font:15px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:110px}
.btn{font:600 13px var(--body);padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.armed{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.hint{color:var(--mute);font-size:13px;max-width:70ch}
@media (max-width:520px){h1{font-size:28px}.logo{width:52px}.col{width:215px}}
@media (prefers-reduced-motion:no-preference){.m{transition:border-color .15s}}
</style>

</head>

<script>
(function(){
'use strict';
/* ---------- Turnierstruktur: 16 Teams, Double Elimination, Tische einstellbar ---------- */
var DEF16S = [
'1|WB|Runde 1|1|1|T1|T2','2|WB|Runde 1|1|2|T3|T4','3|WB|Runde 1|1|3|T5|T6','4|WB|Runde 1|1|4|T7|T8',
'5|WB|Runde 1|1|5|T9|T10','6|WB|Runde 1|1|6|T11|T12','7|WB|Runde 1|2|1|T13|T14','8|WB|Runde 1|2|2|T15|T16',
'9|LB|LB Runde 1|2|3|L1|L2','10|LB|LB Runde 1|2|4|L3|L4','11|WB|Viertelfinale|2|5|W1|W2','12|WB|Viertelfinale|2|6|W3|W4',
'13|LB|LB Runde 1|3|1|L5|L6','14|LB|LB Runde 1|3|2|L7|L8','15|WB|Viertelfinale|3|3|W5|W6','16|WB|Viertelfinale|3|4|W7|W8',
'17|WB|Halbfinale|3|5|W11|W12','18|WB|Halbfinale|4|1|W15|W16',
'19|LB|LB Runde 2|4|2|W9|L16','20|LB|LB Runde 2|4|3|W10|L15','21|LB|LB Runde 2|4|4|W13|L12','22|LB|LB Runde 2|4|5|W14|L11',
'23|LB|LB Runde 3|5|1|W19|W20','24|LB|LB Runde 3|5|2|W21|W22',
'25|WB|WB Finale|6|1|W17|W18','26|LB|LB Halbfinale|6|2|W23|L18','27|LB|LB Halbfinale|6|3|W24|L17',
'28|LB|LB Runde 5|7|1|W26|W27','29|LB|LB Finale|8|1|W28|L25',
'30|F|Großes Finale|9|1|W25|W29','31|F|Entscheidungsspiel (Reset)|10|1|R1|R2'
];
/* ---------- Turnierstrukturen ---------- */
var DEF=[],BYN={},TREE={},GF=30,RST=31,LBF=29,WBF=25,STRUCT=null,schedKey=null;
function nTeams(){return Math.max(2,Math.min(32,Math.floor(+S.teams)||16))}
function link(list){
  BYN={};
  list.forEach(function(g){BYN[g.n]=g;g.deps=[g.a,g.b].filter(function(r){return r[0]==='W'||r[0]==='L'}).map(function(r){return +r.slice(1)})});
}
function build16(){
  DEF=DEF16S.map(function(s){var p=s.split('|');return{n:+p[0],br:p[1],rd:p[2],a:p[5],b:p[6]}});
  link(DEF);
  BYN[25].deps=BYN[25].deps.concat([23,24]); BYN[31].deps=[30];
  TREE={WB:[['Runde 1',[1,2,3,4,5,6,7,8]],['Viertelfinale',[11,12,15,16]],['Halbfinale',[17,18]],['WB Finale',[25]]],
        LB:[['LB Runde 1',[9,10,13,14]],['LB Runde 2',[19,20,21,22]],['LB Runde 3',[23,24]],['LB Halbfinale',[26,27]],['LB Runde 5',[28]],['LB Finale',[29]]]};
  GF=30;RST=31;LBF=29;WBF=25;
}
function seedOrder(P){var o=[1,2];while(o.length<P){var m=o.length*2,n=[];o.forEach(function(x){n.push(x,m+1-x)});o=n}return o}
/* 32er-Feld für 17 bis 32 Teams: fehlende Plätze sind Freilose, jedes Team hat weiterhin zwei Leben */
function build32(){
  var P=32,k=5,tmp=[],so=seedOrder(P),WB=[],LBR=[];
  function mk(br,rd,a,b){var g={br:br,rd:rd,A:a,B:b,idx:tmp.length};tmp.push(g);return g}
  var wbName={16:'Runde 1',8:'Achtelfinale',4:'Viertelfinale',2:'Halbfinale',1:'WB Finale'};
  for(var r=1;r<=k;r++){
    var c=P>>r,row=[];
    for(var i=0;i<c;i++)row.push(r===1?mk('WB','Runde 1',{t:'T',v:so[2*i]},{t:'T',v:so[2*i+1]}):mk('WB',wbName[c],{t:'W',g:WB[r-2][2*i]},{t:'W',g:WB[r-2][2*i+1]}));
    WB.push(row);
  }
  var row1=[];for(var i=0;i<P/4;i++)row1.push(mk('LB','',{t:'L',g:WB[0][2*i]},{t:'L',g:WB[0][2*i+1]}));LBR.push(row1);
  for(var r=2;r<=k;r++){
    var c=P>>r,prev=LBR[LBR.length-1],drop=[];
    for(var i=0;i<c;i++)drop.push(mk('LB','',{t:'W',g:prev[i]},{t:'L',g:WB[r-1][c-1-i]}));
    LBR.push(drop);

/* Zeitplan: Freilos-Spiele brauchen keinen Tisch; echte Spiele so früh wie möglich, höchstens so viele wie Tische */
function schedule(T){
  T=Math.max(1,Math.min(16,Math.floor(+T)||6));
  var key=T+'|'+STRUCT+'|'+nTeams()+'|'+S.absent.join('');
  if(schedKey===key)return; schedKey=key;
  var info={},list=DEF.slice().sort(function(a,b){return a.n-b.n});
  function side(r){var k=+r.slice(1);if(r[0]==='T')return isBye(k)?'BYE':'X';if(r[0]==='R')return'X';var o=info[k];return r[0]==='W'?o.w:o.l}
  list.forEach(function(g){var x=side(g.a),y=side(g.b);g.isAuto=g.n!==RST&&(x==='BYE'||y==='BYE');info[g.n]={w:(x==='BYE'&&y==='BYE')?'BYE':'X',l:(x==='BYE'||y==='BYE')?'BYE':'X'}});

    if(!g.isAuto)return true;
    if(g.deps.every(function(d){return at[d]!=null})){var s=0;g.deps.forEach(function(d){if(at[d]>s)s=at[d]});at[g.n]=s;g.slot=s;g.table=0;ch=true;return false}
    return true})}}

    slot++;var pick=[];
    left.forEach(function(g){if(g.isAuto||pick.length>=T)return;if(g.deps.every(function(d){return at[d]!=null&&at[d]<slot}))pick.push(g)});
    pick.forEach(function(g,i){g.slot=slot;g.table=i+1;at[g.n]=slot});
    left=left.filter(function(g){return at[g.n]==null});

}

  if(cfgWriting){cfgAgain=true;return}
  cfgWriting=true;
  cfgRef.set(JSON.parse(JSON.stringify(cfgOf(S)))).then(function(){setSync('Gespeichert · auf allen Geräten gleich')},function(){setSync('Einstellungen nicht gespeichert',true)}).then(function(){
    cfgWriting=false; if(cfgAgain){cfgAgain=false;flushConfig()}else cfgDirty=false;
  });
}
function writeResult(n){
  if(!resCol)return;
  var key=String(n),r=S.res[n]?JSON.parse(JSON.stringify(S.res[n])):null;
  chains[key]=(chains[key]||Promise.resolve()).then(function(){
    var ref=resCol.doc(key);
    return (r?ref.set(r):ref.delete()).then(function(){setSync('Gespeichert · auf allen Geräten gleich')},function(e){setSync('Nicht gespeichert ('+((e&&e.code)||'Fehler')+')',true);dbg('Speicherfehler Sp. '+n+': '+((e&&e.code)||e))});
  });
}
function adoptCfg(d,base){
  var s=base;
  if(Array.isArray(d.names))s.names=d.names.slice(0,32).concat(Array(32).fill('')).slice(0,32);
  if(Array.isArray(d.absent))s.absent=d.absent.slice(0,32).concat(Array(32).fill(false)).slice(0,32).map(Boolean);
  if(d.teams)s.teams=Math.max(2,Math.min(32,Math.floor(+d.teams)||16));
  if(typeof d.start==='string')s.start=d.start;
  if(d.minutes)s.minutes=+d.minutes||20;
  if(d.tables)s.tables=Math.max(1,Math.min(16,Math.floor(+d.tables)||6));
  return s;
}
function scheduleRender(){if(touching){needRender=true;return}render()}
document.addEventListener('touchstart',function(){touching=true},{passive:true});
document.addEventListener('touchend',function(){setTimeout(function(){touching=false;if(needRender){needRender=false;render()}},120)},{passive:true});
document.addEventListener('touchcancel',function(){touching=false},{passive:true});

try{var ls=localStorage.getItem('bp-state2');if(ls){var d0=JSON.parse(ls);S=adoptCfg(d0,fresh());if(d0.res&&typeof d0.res==='object')S.res=d0.res}}catch(e){}
setSync('Gespeichert auf diesem Gerät',false);
render();

function showGuest(){var g=document.getElementById('guest');if(g)g.hidden=false}
var use=null;
if(use){
  use.call(window.claude,'db').then(function(d){
    if(!d){showGuest();return}
    db=d;cfgRef=db.doc('turnier/config');resCol=db.collection('ergebnisse');
    var loadTimer=setTimeout(function(){setSync('Server gerade nicht erreichbar · lokal gespeichert',true)},10000);
    setSync('Verbinde …',false);
    cfgRef.onSnapshot(function(snap){
      if(!snap.metadata.fromCache)clearTimeout(loadTimer);
      if(cfgDirty||snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        var before=JSON.stringify(cfgOf(S));adoptCfg(snap.data(),S);
        if(JSON.stringify(cfgOf(S))!==before){saveLocal();scheduleRender()}
      }
      setSync('Gespeichert · auf allen Geräten gleich');
    },function(e){clearTimeout(loadTimer);setSync('Speicher nicht verfügbar · nur in diesem Browser',true);cfgRef=null;resCol=null;dbg('Speicher: '+((e&&e.code)||e))});
    resCol.onSnapshot(function(q){
      var m={};
      q.docs.forEach(function(doc){var v=doc.data();if(v&&/^\d+$/.test(doc.id))m[doc.id]=v});
      if(JSON.stringify(m)!==JSON.stringify(S.res)){S.res=m;saveLocal();scheduleRender()}
    },function(e){dbg('Ergebnisse: '+((e&&e.code)||e))});
  }).catch(function(){});
}
})();
</script>
